

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Empire AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:22px 10px;border-bottom:1px solid #5b4825}
.logo{color:#e5bd63;font-size:24px;font-weight:bold}
header p{color:#aaa;font-size:12px;letter-spacing:2px}
main{max-width:700px;margin:auto;padding:18px}
h1,h2{color:#e5bd63}
.intro{text-align:center;color:#ccc;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.tool{background:#1c1c1c;border:1px solid #514020;border-radius:13px;padding:16px;color:white;text-align:left;cursor:pointer}
.tool strong{display:block;margin:8px 0;color:#e5bd63}
.tool span{font-size:13px;color:#bbb;line-height:1.5}
.panel{display:none;margin-top:22px;background:#1b1b1b;border:1px solid #5b4825;border-radius:14px;padding:16px}
.panel.active{display:block}
label{display:block;margin:16px 0 7px}
input,select,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #715b30;background:#242424;color:white;font-size:16px}
textarea{min-height:100px}
button{background:#d6ad53;color:#111;border:0;border-radius:9px;padding:13px;font-weight:bold;width:100%;margin-top:12px}
.secondary{background:#333;color:white}
.result{display:none;white-space:pre-wrap;line-height:1.6;background:#111;border:1px solid #514020;border-radius:10px;padding:14px;margin-top:15px}
#preview{max-width:100%;display:none;margin-top:12px;border-radius:10px}
.back{background:#333;color:white;margin-bottom:10px}
footer{text-align:center;color:#888;padding:24px}
</style>
</head>
<body>

<header>
<div class="logo">GE GOLDEN EMPIRE AI</div>
<p>CREATE • PROMOTE • GROW</p>
</header>

<main>
<h1 style="text-align:center">Your AI Creator Studio</h1>
<p class="intro">Creative tools for images, video, audio, writing and social media—all in one place.</p>

<div class="grid">
<button class="tool" onclick="openTool('art')">🎨<strong>Artwork Maker</strong><span>Create cover, poster and thumbnail prompts.</span></button>
<button class="tool" onclick="openTool('image')">🖼️<strong>Image Upload</strong><span>Upload a photo and make edit ideas.</span></button>
<button class="tool" onclick="openTool('video')">🎬<strong>Video Studio</strong><span>Build video scenes and concepts.</span></button>
<button class="tool" onclick="openTool('audio')">🎙️<strong>Audio Studio</strong><span>Voice, sound and audio ideas.</span></button>
<button class="tool" onclick="openTool('writer')">✍️<strong>AI Writer</strong><span>Draft scripts, bios and descriptions.</span></button>
<button class="tool" onclick="openTool('social')">📱<strong>Social Studio</strong><span>Social captions, hashtags and promo.</span></button>
<button class="tool" onclick="openTool('youtube')">📈<strong>YouTube Studio</strong><span>Titles, tags and video descriptions.</span></button>
<button class="tool" onclick="openTool('ideas')">💡<strong>Idea Lab</strong><span>Brainstorm creative project ideas.</span></button>
</div>

<div id="panel" class="panel">
<button class="back" onclick="goHome()">← BACK TO HOME</button>
<h2 id="toolTitle">AI Tool</h2>

<label>Language</label>
<select id="lang">
<option value="English">English</option>
<option value="Luganda">Luganda</option>
</select>

<label>Project title / Name</label>
<input id="title" placeholder="Enter title or name">

<label>Style</label>
<select id="style">
<option>Natural</option>
<option>Cinematic</option>
<option>Romantic</option>
<option>African style</option>
<option>Illustration</option>
<option>Luxury Gold and Black</option>
<option>Modern</option>
<option>Professional</option>
</select>

<label>Your description / idea</label>
<textarea id="idea" placeholder="Tell us what you want to create..."></textarea>

<div id="uploadArea" style="display:none">
<label>Upload a reference image</label>
<input type="file" id="file" accept="image/*">
<img id="preview" alt="Uploaded image preview">
</div>

<button onclick="generate()">CREATE MY PROMPT</button>
<div id="result" class="result"></div>
<button id="copyBtn" class="secondary" style="display:none" onclick="copyResult()">COPY PROMPT</button>
</div>

</main>
<footer>GOLDEN EMPIRE AI © 2026</footer>

<script>
let currentTool="art";

const toolNames={
art:"🎨 Artwork & Image Prompts",
image:"🖼️ Image Upload & Ideas",
video:"🎬 Video Studio",
audio:"🎙️ Audio Studio",
writer:"✍️ AI Writer",
social:"📱 Social Media Studio",
youtube:"📈 YouTube Growth Studio",
ideas:"💡 Creative Idea Lab"
};

function openTool(name){
currentTool=name;
document.getElementById("panel").classList.add("active");
document.getElementById("toolTitle").textContent=toolNames[name];
document.getElementById("uploadArea").style.display=name==="image"?"block":"none";
document.getElementById("result").style.display="none";
document.getElementById("copyBtn").style.display="none";
window.scrollTo(0,document.getElementById("panel").offsetTop);
}

function goHome(){
document.getElementById("panel").classList.remove("active");
window.scrollTo(0,0);
}

document.getElementById("file").addEventListener("change",function(e){
const file=e.target.files[0];
if(file){
const img=document.getElementById("preview");
img.src=URL.createObjectURL(file);
img.style.display="block";
}
});

function generate(){
const title=document.getElementById("title").value.trim();
const idea=document.getElementById("idea").value.trim();
const style=document.getElementById("style").value;
const lang=document.getElementById("lang").value;

if(!idea && !title){
alert("Please enter your title or idea first.");
return;
}

let prompt="";

if(currentTool==="art"||currentTool==="image"){
prompt=`Create a high-quality original artwork.
Title/Name: ${title||"Untitled"}
Style: ${style}
Idea: ${idea||"Create a beautiful original design."}
Make it detailed, professional, visually attractive, well composed, and suitable for digital use.`;
}
else if(currentTool==="video"){
prompt=`Create a video concept and scene plan.
Project: ${title}
Style: ${style}
Idea: ${idea}
Include scene descriptions, camera movement, lighting, transitions, and a strong ending.`;
}
else if(currentTool==="audio"){
prompt=`Create an audio production plan.
Project: ${title}
Style: ${style}
Idea: ${idea}
Suggest voice direction, mood, sound design, and recording ideas.`;
}
else if(currentTool==="writer"){
prompt=`Write an original creative draft.
Title: ${title}
Style: ${style}
Idea: ${idea}
Make it clear, engaging, well structured, and original.`;
}
else if(currentTool==="social"){
prompt=`Create social media content.
Project: ${title}
Style: ${style}
Idea: ${idea}
Include a caption, a short call to action, and relevant hashtags.`;
}
else if(currentTool==="youtube"){
prompt=`Create YouTube promotion content.
Video: ${title}
Style: ${style}
Idea: ${idea}
Suggest 5 clickable titles, a description, relevant keywords, and hashtags. Avoid misleading clickbait.`;
}
else{
prompt=`Brainstorm creative ideas.
Project: ${title}
Style: ${style}
Idea: ${idea}
Suggest 5 original ideas with brief explanations.`;
}

if(lang==="Luganda"){
prompt+=" Please write the final result in Luganda.";
}

const box=document.getElementById("result");
box.textContent=prompt;
box.style.display="block";
document.getElementById("copyBtn").style.display="block";
}

function copyResult(){
const text=document.getElementById("result").textContent;
if(navigator.clipboard){
navigator.clipboard.writeText(text)
.then(()=>alert("Prompt copied!"))
.catch(()=>alert("Select the text and copy it."));
}else{
alert("Select the text and copy it.");
}
}
</script>
</body>
</html>
